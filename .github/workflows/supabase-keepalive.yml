# Keeps the free Supabase project (client portal) awake.
# Supabase pauses free projects after 7 days without activity, so this
# touches the database every 3 days. It only reads the current time.
name: Keep client portal awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, 9:17 AM Eastern (14:17 UTC)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
              "https://rydpyqrvwvejhclcbhuf.supabase.co/rest/v1/rpc/keepalive" \
              -H "apikey: sb_publishable_nFOf7Wu9hriXIv8-xO3hdw_HOKuzDGb" \
              -H "Content-Type: application/json" -d '{}')
            echo "Attempt $i: HTTP $code $(cat /tmp/out)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer. The project may be paused: open supabase.com, pick MRF Client Portal, and click Resume project."
          exit 1
